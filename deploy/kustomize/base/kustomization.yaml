apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace here on purpose: scripts/install.sh (or `oc apply -n`) chooses it.
labels:
  - pairs:
      app.kubernetes.io/part-of: marketlab
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
resources:
  - backend.yaml
  - frontend.yaml
  - networkpolicy.yaml
