apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketlab-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - {name: MARKETLAB_DB_HOST, value: marketlab-postgres}
            - name: MARKETLAB_DB_NAME
              valueFrom: {secretKeyRef: {name: marketlab-db, key: POSTGRESQL_DATABASE}}
            - name: MARKETLAB_DB_USER
              valueFrom: {secretKeyRef: {name: marketlab-db, key: POSTGRESQL_USER}}
            - name: MARKETLAB_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: marketlab-db, key: POSTGRESQL_PASSWORD}}
