apiVersion: v1
kind: ServiceAccount
metadata:
  name: marketlab-backend
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketlab-backend-config
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
data:
  MARKETLAB_ENVIRONMENT: "kubernetes"
  MARKETLAB_LOG_LEVEL: "INFO"
  MARKETLAB_LOG_JSON: "true"
  MARKETLAB_PERSISTENCE_MODE: "memory"
  MARKETLAB_SIM_SEED: "42"
  MARKETLAB_SIM_TICK_INTERVAL_MS: "250"
  MARKETLAB_EVENT_HISTORY_LIMIT: "5000"
  MARKETLAB_WS_QUEUE_SIZE: "500"
  MARKETLAB_WS_MAX_CLIENTS: "20"
---
apiVersion: v1
kind: Service
metadata:
  name: marketlab-backend
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
  ports:
    - {name: http, port: 8000, targetPort: http, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketlab-backend
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
spec:
  # Exactly one replica: all simulation state lives in one process (see docs/DESIGN.md §2).
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
    spec:
      serviceAccountName: marketlab-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: marketlab-backend
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          envFrom:
            - configMapRef: {name: marketlab-backend-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /healthz/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
