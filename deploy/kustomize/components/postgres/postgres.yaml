apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marketlab-postgres
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
  # storageClassName omitted: the cluster default is used. Set it in an overlay if needed.
---
apiVersion: v1
kind: Service
metadata:
  name: marketlab-postgres
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketlab-postgres
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
  template:
    metadata:
      labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          # sclorg image: runs as an arbitrary UID (OpenShift restricted-v2), configured via POSTGRESQL_* env.
          image: marketlab-postgres
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432, protocol: TCP}
          envFrom:
            - secretRef: {name: marketlab-db}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            exec: {command: ["/usr/libexec/check-container"]}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["/usr/libexec/check-container"]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["/usr/libexec/check-container", "--live"]}
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: marketlab-postgres}
---
# Only the backend may reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marketlab-postgres-ingress
  labels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: database}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: marketlab, app.kubernetes.io/component: backend}
      ports:
        - {port: 5432, protocol: TCP}
